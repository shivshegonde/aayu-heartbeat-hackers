    function updateSlide() {
      const s = slides[current];
      const container = document.getElementById('slide-container');

      `;

      document.getElementById('progress-bar').style.width = `${((current + 1) / slides.length) * 100}%`;
      document.getElementById('notes-content').innerText = s.notes;

      // Update dots
      const dots = document.getElementById('dots-container');
      dots.innerHTML = slides.map((_, i) => `
        <button onclick="gotoSlide(${i})" class="transition-all rounded-full cursor-pointer ${
          i === current ? 'w-8 h-2.5 bg-gradient-to-r from-teal-400 to-cyan-400 shadow-[0_0_8px_rgba(45,212,191,0.5)]' : 'w-2.5 h-2.5 bg-slate-800 hover:bg-slate-700'
        }"></button>
      `).join('');
    }

    function nextSlide() { if (current < slides.length - 1) { current++; updateSlide(); } }
    function prevSlide() { if (current > 0) { current--; updateSlide(); } }
    function gotoSlide(idx) { current = idx; updateSlide(); }

    function toggleNotes() {
      showNotesState = !showNotesState;
      document.getElementById('notes-drawer').classList.toggle('hidden', !showNotesState);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') { e.preventDefault(); nextSlide(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
      else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); toggleNotes(); }
    });

    updateSlide();
